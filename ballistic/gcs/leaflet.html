<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ballistic GCS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #222; }
    .info {
      position: absolute; bottom: 8px; left: 8px; z-index: 1000;
      background: rgba(0,0,0,0.6); color: #eee; padding: 4px 8px;
      font: 12px sans-serif; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">Waiting for telemetry...</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let launchMarker = null;
    let roundMarker = null;
    let trail = null;
    const points = [];
    let centred = false;

    function update(lat, lon, alt, t) {
      if (!centred) {
        map.setView([lat, lon], 11);
        launchMarker = L.circleMarker([lat, lon], {
          radius: 6, color: '#ff0', fillColor: '#ff0', fillOpacity: 1
        }).addTo(map).bindTooltip('Launch', { permanent: false });
        centred = true;
      }
      points.push([lat, lon]);
      if (!trail) {
        trail = L.polyline(points, { color: '#0ff', weight: 2 }).addTo(map);
      } else {
        trail.setLatLngs(points);
      }
      if (!roundMarker) {
        roundMarker = L.circleMarker([lat, lon], {
          radius: 5, color: '#f33', fillColor: '#f33', fillOpacity: 1
        }).addTo(map);
      } else {
        roundMarker.setLatLng([lat, lon]);
      }
      document.getElementById('info').textContent =
        `t=${t.toFixed(2)}s  lat=${lat.toFixed(5)}  lon=${lon.toFixed(5)}  alt=${alt.toFixed(1)}m`;
    }

    function reset() {
      points.length = 0;
      if (trail) { map.removeLayer(trail); trail = null; }
      if (roundMarker) { map.removeLayer(roundMarker); roundMarker = null; }
      if (launchMarker) { map.removeLayer(launchMarker); launchMarker = null; }
      centred = false;
      document.getElementById('info').textContent = 'Waiting for telemetry...';
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      const bridge = channel.objects.bridge;
      bridge.fix.connect((lat, lon, alt, t) => update(lat, lon, alt, t));
      bridge.reset_signal.connect(() => reset());
    });
  </script>
</body>
</html>
